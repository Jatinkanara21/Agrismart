name: AgriSmart Web Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve production API URL
        env:
          CONFIGURED_API_URL: ${{ vars.AGRISMART_API_URL }}
        run: |
          API_URL="$CONFIGURED_API_URL"
          if [ -z "$API_URL" ]; then
            API_URL="https://agrismart-api-bcbu.onrender.com/api/v1"
            echo "AGRISMART_API_URL is not set; using the deployed AgriSmart Render API."
          fi
          case "$API_URL" in
            https://*) ;;
            *)
              echo "::error::AGRISMART_API_URL must use HTTPS in production."
              exit 1
              ;;
          esac
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "Production API URL configured."
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Enable web platform
        run: flutter create --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --base-href "/Agrismart/" --dart-define=API_BASE_URL="$API_URL"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
