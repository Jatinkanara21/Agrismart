name: Laravel CI
on:
  push:
    paths: ['backend/**','.github/workflows/laravel.yml']
  pull_request:
    paths: ['backend/**','.github/workflows/laravel.yml']
concurrency:
  group: agrismart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: agrismart_test }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,pdo_mysql,pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: mkdir -p bootstrap/cache && chmod -R u+rwX bootstrap/cache
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate --force
        env: { DB_DATABASE: agrismart_test, DB_USERNAME: root, DB_PASSWORD: root }
      - run: php artisan test
        env: { DB_DATABASE: agrismart_test, DB_USERNAME: root, DB_PASSWORD: root }
