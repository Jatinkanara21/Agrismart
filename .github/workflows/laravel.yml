name: Python Backend CI
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/laravel.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/laravel.yml'
concurrency:
  group: agrismart-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Import FastAPI application
        run: python -c "from main import app; print(app.title)"
      - name: Verify API routes
        run: python -c "from main import app; paths=sorted(r.path for r in app.routes); required = {'/api/v1/health', '/api/v1/auth/login', '/api/v1/auth/register', '/api/v1/auth/logout', '/api/v1/user', '/api/v1/dashboard', '/api/v1/crops/recommend', '/api/v1/disease/detect', '/api/v1/yield/predict', '/api/v1/weather', '/api/v1/agribot/chat', '/api/v1/farming/decision'}; missing = sorted(required - set(paths)); assert not missing, f'Missing API routes: {missing}'; print(*paths, sep='\\n')"
