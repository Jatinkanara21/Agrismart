name: Train AgriSmart Offline Disease Model

on:
  push:
    branches: [main]
    paths:
      - 'ml/**'
      - 'lib/services/local_disease_service.dart'
      - '.github/workflows/train-offline-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: pip install -r ml/requirements.txt

      - name: Train MobileNetV2
        run: python ml/train.py

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Copy trained model into Flutter assets
        run: |
          mkdir -p assets/models
          cp ml/output/plant_disease.tflite assets/models/plant_disease.tflite

      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/plant_disease.tflite
          git commit -m "ml: add trained offline plant disease model" || echo "No model changes to commit"
          git push

      - name: Upload training outputs
        uses: actions/upload-artifact@v4
        with:
          name: agrismart-offline-model
          path: |
            ml/output/plant_disease.tflite
            ml/output/labels.json
            ml/output/metrics.json
