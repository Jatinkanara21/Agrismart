name: Flutter CI
on:
  push:
    paths: ['mobile/**','.github/workflows/flutter.yml']
  pull_request:
    paths: ['mobile/**','.github/workflows/flutter.yml']
concurrency:
  group: agrismart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.0', channel: stable }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
