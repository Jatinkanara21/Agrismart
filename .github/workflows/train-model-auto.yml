name: Train AgriSmart ML Model

on:
  push:
    paths:
      - 'ml/**'
      - '.github/workflows/train-model-auto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt

      - name: Train MobileNetV2 plant disease model
        run: python ml/train.py

      - name: Verify outputs
        run: |
          test -s ml/output/plant_disease.tflite
          test -s ml/output/labels.json
          test -s ml/output/metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          labels = json.loads(Path('ml/output/labels.json').read_text())
          metrics = json.loads(Path('ml/output/metrics.json').read_text())
          assert len(labels) == 38, f'Expected 38 classes, got {len(labels)}'
          print('Classes:', len(labels))
          print('Images:', metrics['images'])
          print('Validation accuracy:', metrics['validation_accuracy'])
          PY

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: agrismart-plant-disease-model
          path: |
            ml/output/plant_disease.tflite
            ml/output/labels.json
            ml/output/metrics.json
          retention-days: 30
