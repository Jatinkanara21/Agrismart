name: Train AgriSmart ML Model

on:
  workflow_dispatch:
  push:
    paths:
      - 'ml/**'
      - '.github/workflows/train-model-auto.yml'

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/requirements.txt

      - name: Train model
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python ml/train.py

      - name: Verify trained model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import tensorflow as tf

          out = Path('ml/output')
          model = out / 'plant_disease.tflite'
          labels = out / 'labels.json'
          metrics = out / 'metrics.json'

          assert model.is_file() and model.stat().st_size > 10000, 'Invalid TFLite model'
          assert labels.is_file(), 'Missing labels.json'
          assert metrics.is_file(), 'Missing metrics.json'

          names = json.loads(labels.read_text())
          stats = json.loads(metrics.read_text())
          assert len(names) == 38, f'Expected 38 labels, got {len(names)}'
          assert stats['classes'] == 38
          assert stats['images'] > 0
          assert 0 <= stats['validation_accuracy'] <= 1

          # Real TFLite load/inference compatibility check.
          interpreter = tf.lite.Interpreter(model_path=str(model))
          interpreter.allocate_tensors()
          inp = interpreter.get_input_details()[0]
          outp = interpreter.get_output_details()[0]
          assert list(inp['shape']) == [1, 224, 224, 3], inp['shape']
          assert outp['shape'][-1] == 38, outp['shape']
          import numpy as np
          x = np.zeros(inp['shape'], dtype=inp['dtype'])
          interpreter.set_tensor(inp['index'], x)
          interpreter.invoke()
          y = interpreter.get_tensor(outp['index'])
          assert y.shape[-1] == 38

          print('MODEL OK')
          print('Images:', stats['images'])
          print('Images/class:', stats['images_per_class'])
          print('Validation accuracy:', stats['validation_accuracy'])
          print('TFLite input:', inp['shape'], inp['dtype'])
          print('TFLite output:', outp['shape'], outp['dtype'])
          PY

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: agrismart-plant-disease-model
          path: ml/output/
          retention-days: 30
