name: agrismart
description: Premium smart agriculture Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  go_router: ^14.2.7
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  flutter_litert: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
